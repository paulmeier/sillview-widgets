name: Publish registry

# On every push to main, re-verify that registry/index.json matches the widgets
# directory and publish it to GitHub Pages, giving the sillview app a stable,
# cache-friendly endpoint to fetch the catalog from:
#
#   https://paulmeier.github.io/sillview-widgets/index.json
#
# The committed file at registry/index.json (on the raw endpoint) remains the
# source of truth; Pages is a CDN-backed mirror. Enable Pages for the repo
# (Settings -> Pages -> Source: GitHub Actions) for this workflow to deploy.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build & publish index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify index is current
        run: node dist/cli.mjs index --check
      - name: Stage site
        run: |
          mkdir -p _site
          cp registry/index.json _site/index.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
